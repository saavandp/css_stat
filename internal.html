<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1{
            background-color: navy;
            color: black;
            border: 5px solid black;
        }

        h2{
            background-color: darkslateblue;
            color: black;
            border: black;
        }

        .heading{
            background-color: lightskyblue;
        }

        .bg-danger{
            background-color: red;
            color: white;
        }

        .border-success{
            border: 5px solid green;
        }

        .bg-primary{
            background-color: blue;
        }

        .text-white{
            color: white;
        }
    </style>

</head>
<body>
    <h1>Internal Css</h1>
    <h2>Welcome to CSS journey</h2>
    <h1 class="heading">PYTHON DJANGO</h1>
    <h1 class="bg-danger border-success">DjangoRestFrameworks</h1>
    <h1 class="bg-primary text-white">ASP.NET</h1>
</body>
</html>
